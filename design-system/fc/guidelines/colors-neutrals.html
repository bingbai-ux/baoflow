<!-- @dsCard group="Colors" viewport="700x150" name="ニュートラル派生6色" subtitle="背景・行・線・補助文字。白文字は使わない" -->
<!DOCTYPE html>
<html lang="ja"><head><meta charset="utf-8"><title>ニュートラル</title>
<link rel="stylesheet" href="../styles.css">
<style>
body{background:var(--fc-card);padding:16px;font-family:var(--fc-font)}
.sw{display:grid;gap:8px}
.chipbox{border:1px solid var(--fc-line);border-radius:var(--fc-r-card);overflow:hidden;background:var(--fc-card)}
.chipbox .c{height:52px}
.chipbox .m{padding:7px 11px;font-size:var(--fc-fs-xs);line-height:1.5}
.chipbox .m b{display:block;font-size:11.5px;font-weight:800}
.chipbox .m span{color:var(--fc-text-muted);font-size:10.5px}
.lbl{font-size:10.5px;font-weight:700;letter-spacing:.06em;color:var(--fc-text-muted);line-height:1;margin-bottom:8px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
</style></head><body>
<div class="sw" style="grid-template-columns:repeat(6,1fr)">
<div class="chipbox"><div class="c" style="background:#FFFFFF;border-bottom:1px solid var(--fc-line)"></div><div class="m"><b>Card</b><span>#FFFFFF · 作業エリア</span></div></div>
<div class="chipbox"><div class="c" style="background:#EFEFEA;border-bottom:1px solid var(--fc-line)"></div><div class="m"><b>BG</b><span>#EFEFEA · ページ背景</span></div></div>
<div class="chipbox"><div class="c" style="background:#FBFAF6;border-bottom:1px solid var(--fc-line)"></div><div class="m"><b>Row</b><span>#FBFAF6 · リスト行・ホバー</span></div></div>
<div class="chipbox"><div class="c" style="background:#E2E1DA"></div><div class="m"><b>Line</b><span>#E2E1DA · 区切り線・枠</span></div></div>
<div class="chipbox"><div class="c" style="background:#84787D"></div><div class="m"><b>Ink Soft</b><span>#84787D · 白地の補助文字</span></div></div>
<div class="chipbox"><div class="c" style="background:#9C8290"></div><div class="m"><b>Cassis Soft</b><span>#9C8290 · Cassis面の補助文字</span></div></div>
</div></body></html>
