<!-- @dsCard group="Brand" viewport="700x215" name="Wasabiは1画面1点" subtitle="ロゴピルと選択中メニューは固定要素として別枠" -->
<!DOCTYPE html>
<html lang="ja"><head><meta charset="utf-8"><title>Wasabi</title>
<link rel="stylesheet" href="../styles.css">
<style>
body{background:var(--fc-card);padding:16px;font-family:var(--fc-font)}
.sw{display:grid;gap:8px}
.chipbox{border:1px solid var(--fc-line);border-radius:var(--fc-r-card);overflow:hidden;background:var(--fc-card)}
.chipbox .c{height:52px}
.chipbox .m{padding:7px 11px;font-size:var(--fc-fs-xs);line-height:1.5}
.chipbox .m b{display:block;font-size:11.5px;font-weight:800}
.chipbox .m span{color:var(--fc-text-muted);font-size:10.5px}
.lbl{font-size:10.5px;font-weight:700;letter-spacing:.06em;color:var(--fc-text-muted);line-height:1;margin-bottom:8px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
</style></head><body>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;font-size:var(--fc-fs-sm)">
  <div style="border:1px solid var(--fc-line);border-radius:var(--fc-r-card);padding:12px">
    <div class="lbl"><span style="background:var(--fc-coolblue);color:var(--fc-blue-ink);padding:3px 8px;border-radius:999px;margin-right:6px">✓</span>作業エリアの主アクション1つ</div>
    <div style="display:flex;gap:8px;flex-wrap:wrap">
      <span style="background:var(--fc-wasabi);color:var(--fc-wasabi-ink);font-size:12px;font-weight:800;padding:10px 18px;border-radius:999px">承認する</span>
      <span style="background:var(--fc-card);color:var(--fc-text-body);border:1px solid var(--fc-line);font-size:12px;font-weight:700;padding:10px 16px;border-radius:999px">差し戻す</span>
    </div>
  </div>
  <div style="border:1px solid var(--fc-line);border-radius:var(--fc-r-card);padding:12px">
    <div class="lbl"><span style="background:var(--fc-orange-tint);color:var(--fc-orange-ink);padding:3px 8px;border-radius:999px;margin-right:6px">✗</span>3点以上に散らす</div>
    <div style="display:flex;gap:8px;flex-wrap:wrap">
      <span style="background:var(--fc-wasabi);color:var(--fc-wasabi-ink);font-size:12px;font-weight:800;padding:10px 16px;border-radius:999px">操作</span><span style="background:var(--fc-wasabi);color:var(--fc-wasabi-ink);font-size:12px;font-weight:800;padding:10px 16px;border-radius:999px">操作</span><span style="background:var(--fc-wasabi);color:var(--fc-wasabi-ink);font-size:12px;font-weight:800;padding:10px 16px;border-radius:999px">操作</span>
    </div>
  </div>
</div>
<div style="margin-top:10px;font-size:var(--fc-fs-xs);color:var(--fc-text-muted);line-height:1.7">数え方: ロゴピル（BrandPill）と選択中のサイドバー項目は固定要素なので数えない。数えるのは作業エリアの Wasabi（主要ボタン / NoteCard / 現在値のバー）で、合計2点までに収める。</div>
</body></html>
