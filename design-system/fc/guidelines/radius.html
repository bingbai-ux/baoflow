<!-- @dsCard group="Brand" viewport="700x160" name="角丸 — 形で役割が分かる" subtitle="ピル=操作 / 16px=カード / 24px=画面の外枠" -->
<!DOCTYPE html>
<html lang="ja"><head><meta charset="utf-8"><title>角丸</title>
<link rel="stylesheet" href="../styles.css">
<style>
body{background:var(--fc-card);padding:16px;font-family:var(--fc-font)}
.sw{display:grid;gap:8px}
.chipbox{border:1px solid var(--fc-line);border-radius:var(--fc-r-card);overflow:hidden;background:var(--fc-card)}
.chipbox .c{height:52px}
.chipbox .m{padding:7px 11px;font-size:var(--fc-fs-xs);line-height:1.5}
.chipbox .m b{display:block;font-size:11.5px;font-weight:800}
.chipbox .m span{color:var(--fc-text-muted);font-size:10.5px}
.lbl{font-size:10.5px;font-weight:700;letter-spacing:.06em;color:var(--fc-text-muted);line-height:1;margin-bottom:8px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
</style></head><body>
<div class="row" style="gap:12px">
  <div style="text-align:center"><div style="width:120px;height:40px;background:var(--fc-wasabi);border-radius:999px"></div><div class="lbl" style="margin:6px 0 0">999px ボタン・バッジ・チップ</div></div>
  <div style="text-align:center"><div style="width:120px;height:64px;background:var(--fc-card);border:1px solid var(--fc-line);border-radius:16px"></div><div class="lbl" style="margin:6px 0 0">16px カード・行・表</div></div>
  <div style="text-align:center"><div style="width:120px;height:64px;background:var(--fc-card);border:1px solid var(--fc-line);border-radius:12px"></div><div class="lbl" style="margin:6px 0 0">12px 入力欄・メニュー項目</div></div>
  <div style="text-align:center"><div style="width:120px;height:64px;background:var(--fc-cassis);border-radius:24px"></div><div class="lbl" style="margin:6px 0 0">24px 画面の外枠</div></div>
</div></body></html>
