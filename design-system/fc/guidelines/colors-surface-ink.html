<!-- @dsCard group="Colors" viewport="700x170" name="面とインクの組み合わせ" subtitle="色面の文字は同じ色相の濃淡で書く（ルール3）" -->
<!DOCTYPE html>
<html lang="ja"><head><meta charset="utf-8"><title>面とインク</title>
<link rel="stylesheet" href="../styles.css">
<style>
body{background:var(--fc-card);padding:16px;font-family:var(--fc-font)}
.sw{display:grid;gap:8px}
.chipbox{border:1px solid var(--fc-line);border-radius:var(--fc-r-card);overflow:hidden;background:var(--fc-card)}
.chipbox .c{height:52px}
.chipbox .m{padding:7px 11px;font-size:var(--fc-fs-xs);line-height:1.5}
.chipbox .m b{display:block;font-size:11.5px;font-weight:800}
.chipbox .m span{color:var(--fc-text-muted);font-size:10.5px}
.lbl{font-size:10.5px;font-weight:700;letter-spacing:.06em;color:var(--fc-text-muted);line-height:1;margin-bottom:8px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
</style></head><body>
<div style="display:grid;grid-template-columns:repeat(5,1fr);gap:8px">
  <div style="background:#E9F056;color:#666C14;border-radius:var(--fc-r-card);padding:14px"><div style="font-size:12px;font-weight:800">Wasabi面</div><div style="font-size:11px;margin-top:4px">ひとこと・AIのきづき</div></div>
  <div style="background:#D7EFFF;color:#33566F;border-radius:var(--fc-r-card);padding:14px"><div style="font-size:12px;font-weight:800">Cool Blue面</div><div style="font-size:11px;margin-top:4px">数値・データ</div></div>
  <div style="background:#FFD8C2;color:#B03616;border-radius:var(--fc-r-card);padding:14px"><div style="font-size:12px;font-weight:800">Orange Tint面</div><div style="font-size:11px;margin-top:4px">期限・要対応</div></div>
  <div style="background:#351E28;color:#C9A2B8;border-radius:var(--fc-r-card);padding:14px"><div style="font-size:12px;font-weight:800">Cassis面</div><div style="font-size:11px;margin-top:4px;color:#9C8290">サイドバー・ナビ</div></div>
  <div style="background:#AEB8A0;color:#4C5544;border-radius:var(--fc-r-card);padding:14px"><div style="font-size:12px;font-weight:800">Sauge面</div><div style="font-size:11px;margin-top:4px">無効・限定使用</div></div>
</div></body></html>
