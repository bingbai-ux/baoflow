<!-- @dsCard group="Brand" viewport="700x200" name="2層構造 — Cassis面 + 白い作業エリア" subtitle="濃い面はナビだけ。作業は白地で行う" -->
<!DOCTYPE html>
<html lang="ja"><head><meta charset="utf-8"><title>2層</title>
<link rel="stylesheet" href="../styles.css">
<style>
body{background:var(--fc-card);padding:16px;font-family:var(--fc-font)}
.sw{display:grid;gap:8px}
.chipbox{border:1px solid var(--fc-line);border-radius:var(--fc-r-card);overflow:hidden;background:var(--fc-card)}
.chipbox .c{height:52px}
.chipbox .m{padding:7px 11px;font-size:var(--fc-fs-xs);line-height:1.5}
.chipbox .m b{display:block;font-size:11.5px;font-weight:800}
.chipbox .m span{color:var(--fc-text-muted);font-size:10.5px}
.lbl{font-size:10.5px;font-weight:700;letter-spacing:.06em;color:var(--fc-text-muted);line-height:1;margin-bottom:8px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
</style></head><body>
<div style="display:flex;height:160px;border-radius:24px;overflow:hidden;box-shadow:var(--fc-shadow-frame)">
  <div style="width:170px;background:var(--fc-cassis);padding:14px 10px;display:flex;flex-direction:column;gap:4px">
    <span style="align-self:flex-start;background:var(--fc-wasabi);color:var(--fc-wasabi-ink);font-size:10px;font-weight:800;letter-spacing:.04em;padding:5px 11px;border-radius:999px">F&amp;C Portal</span>
    <div style="margin-top:10px;font-size:10px;font-weight:800;color:var(--fc-cassis-tint);padding:0 6px">法令・勤怠</div>
    <div style="background:var(--fc-wasabi);color:var(--fc-wasabi-ink);font-size:11px;font-weight:800;border-radius:12px;padding:7px 10px">有給5日</div>
    <div style="color:var(--fc-cassis-tint);font-size:11px;padding:7px 10px">月次締めフロー</div>
    <div style="color:var(--fc-cassis-tint);font-size:11px;padding:7px 10px">雇用契約管理</div>
  </div>
  <div style="flex:1;background:var(--fc-card);padding:14px 16px">
    <div style="font-size:15px;font-weight:800">有給5日取得の進捗</div>
    <div style="font-size:11px;color:var(--fc-text-muted);margin-top:4px">対象21名 · 黒線＝義務の5日</div>
    <div style="margin-top:12px;background:var(--fc-coolblue);color:var(--fc-blue-ink);border-radius:16px;padding:10px 12px;font-size:11px;font-weight:700">12名 達成済み　6名 順調　3名 要対応</div>
  </div>
</div></body></html>
