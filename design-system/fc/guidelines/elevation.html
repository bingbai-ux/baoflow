<!-- @dsCard group="Brand" viewport="700x170" name="影は外枠1箇所だけ" subtitle="中身は線で区切る。カードを浮かせない" -->
<!DOCTYPE html>
<html lang="ja"><head><meta charset="utf-8"><title>影</title>
<link rel="stylesheet" href="../styles.css">
<style>
body{background:var(--fc-card);padding:16px;font-family:var(--fc-font)}
.sw{display:grid;gap:8px}
.chipbox{border:1px solid var(--fc-line);border-radius:var(--fc-r-card);overflow:hidden;background:var(--fc-card)}
.chipbox .c{height:52px}
.chipbox .m{padding:7px 11px;font-size:var(--fc-fs-xs);line-height:1.5}
.chipbox .m b{display:block;font-size:11.5px;font-weight:800}
.chipbox .m span{color:var(--fc-text-muted);font-size:10.5px}
.lbl{font-size:10.5px;font-weight:700;letter-spacing:.06em;color:var(--fc-text-muted);line-height:1;margin-bottom:8px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
</style></head><body>
<div class="row" style="gap:16px;align-items:flex-start">
  <div>
    <div class="lbl"><span style="background:var(--fc-coolblue);color:var(--fc-blue-ink);padding:3px 8px;border-radius:999px;margin-right:6px">✓</span>外枠のみ</div>
    <div style="width:230px;background:var(--fc-card);border-radius:24px;box-shadow:var(--fc-shadow-frame);padding:12px">
      <div style="border:1px solid var(--fc-line);border-radius:12px;padding:8px;font-size:11px;color:var(--fc-text-muted)">中のカードは線</div>
    </div>
  </div>
  <div>
    <div class="lbl" style="color:#B03616">✗ 中にも影</div>
    <div style="width:230px;background:var(--fc-card);border-radius:24px;box-shadow:var(--fc-shadow-frame);padding:12px">
      <div style="border-radius:12px;padding:8px;font-size:11px;color:var(--fc-text-muted);box-shadow:0 4px 12px rgba(53,30,40,.18)">中のカードも浮いている</div>
    </div>
  </div>
</div></body></html>
